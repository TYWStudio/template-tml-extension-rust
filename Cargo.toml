[package]
name = "tml-ext"
version = "1.0.0"
edition = "2021"
description = "TML Extension API v1 example extension (Rust)"
license = "CC-BY-NC-4.0"
publish = false

[[bin]]
name = "tml_ext"
path = "src/main.rs"

# 扩展是独立子进程，产物越小越好
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
